<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شحن النجوم</title>
<style>
  :root {
    --bg: #0b0d12; --bg2: #12151c; --card: #161a23; --line: #262c39;
    --text: #f4f6fb; --muted: #8b93a7;
    --accent: #3b82f6; --accent2: #2563eb; --accent-ink: #ffffff;
    --ok: #2ecc71; --err: #ff6b6b; --star: #ffc53d;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    padding: 18px 16px 28px;
    overflow-x: hidden;
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  [hidden] { display: none !important; }

  header { text-align: center; margin: 6px 0 20px; }
  .badge {
    display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); margin-bottom: 12px;
  }
  h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
  .sub { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }

  /* الرصيد والأيدي */
  .info { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 2px 16px; margin-bottom: 20px; }
  .stat { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
  .stat + .stat { border-top: 1px dashed var(--line); }
  .stat .k { font-size: 13px; color: var(--muted); flex: none; }
  .stat .v { font-size: 22px; font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
  .stat.bal .v { color: var(--star); }
  .stat.bal .v.long { font-size: 15px; }
  .stat.bal .u { font-size: 12px; color: var(--muted); font-weight: 600; margin-inline-start: 4px; }
  .stat.uid .v { direction: ltr; }

  /* أزرار الباقات (8) */
  .section-title { text-align: center; font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 12px; }
  .tiers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tier {
    appearance: none; border: 0; cursor: pointer; font: inherit; color: var(--accent-ink);
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    border-radius: 18px; padding: 16px 8px; text-align: center;
    box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 32%, transparent);
    transition: transform .12s ease, opacity .12s ease;
  }
  .tier:active { transform: scale(.96); }
  .tier:disabled { opacity: .5; cursor: default; }
  .tier .n { font-size: 26px; font-weight: 800; line-height: 1.2; }
  .tier .p { margin-top: 4px; font-size: 12.5px; font-weight: 600; opacity: .88; }

  .foot { text-align: center; margin-top: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }

  /* نافذة التأكيد */
  .cta {
    display: block; width: 100%; border: 0; border-radius: 16px; padding: 16px 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 16.5px; font-weight: 800;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .cta:disabled { opacity: .4; box-shadow: none; cursor: default; }
  .cta.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); box-shadow: none; margin-top: 10px; }
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet {
    width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 24px 24px 0 0; padding: 22px 18px calc(22px + var(--safe-bottom));
    animation: up .22s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0 0 14px; text-align: center; font-size: 19px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .row:last-of-type { border-bottom: 0; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 800; font-size: 17px; }
  .sheet .note { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 14px; line-height: 1.6; }

  /* نجاح */
  .done { text-align: center; padding: 30px 6px; }
  .done .ic {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); font-size: 44px; font-weight: 800;
  }
  .done h2 { margin: 0 0 8px; font-size: 22px; }
  .done p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .done .info { padding: 2px 16px; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + var(--safe-bottom));
    background: var(--card); border: 1px solid var(--err); color: var(--text); padding: 11px 16px; border-radius: 12px;
    font-size: 13.5px; z-index: 40; max-width: 90%; text-align: center;
  }

  /* ===== تحسينات الشكل والتفاعل ===== */
  header { position: relative; }
  .badge { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent) inset; }
  h1 { background: linear-gradient(90deg, #fff, #9cc2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .info {
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, var(--card)), var(--card));
    border-color: color-mix(in srgb, var(--accent) 22%, var(--line));
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .stat.bal .v { text-shadow: 0 0 18px color-mix(in srgb, var(--star) 45%, transparent); }
  .tiers { gap: 13px; }
  .tier {
    position: relative; overflow: hidden; padding: 18px 8px 16px; border-radius: 20px;
    background: linear-gradient(155deg, #4f96ff 0%, #3b82f6 45%, #1f56d6 100%);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 10px 24px rgba(37,99,235,.38), inset 0 1px 0 rgba(255,255,255,.35);
    opacity: 0; animation: pop .45s cubic-bezier(.2,.9,.3,1.2) forwards;
    transition: transform .14s cubic-bezier(.2,.9,.3,1.3), box-shadow .14s ease, filter .14s ease;
  }
  .tier::before {
    content: ''; position: absolute; inset: 0 0 55% 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
  }
  .tier .n { position: relative; font-size: 27px; text-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .tier .p { position: relative; display: inline-block; margin-top: 7px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 12px; }
  .tier:active { transform: scale(.94); filter: brightness(1.08); box-shadow: 0 4px 12px rgba(37,99,235,.35), inset 0 1px 0 rgba(255,255,255,.3); }
  .tier:disabled { filter: saturate(.6); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none; background: rgba(255,255,255,.45);
    transform: scale(0); animation: rip .6s ease-out forwards;
  }
  @keyframes rip { to { transform: scale(1); opacity: 0; } }

  /* زر النجوم الصغير */
  .spark {
    position: absolute; top: 0; left: 0; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    transition: transform .15s ease; padding: 0;
  }
  .spark:active { transform: scale(.85) rotate(-12deg); }
  .fly { position: fixed; z-index: 60; pointer-events: none; font-size: 20px; will-change: transform, opacity; }

  /* زر الدعم الفني */
  .support {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 22px;
    padding: 14px 0; border-radius: 16px; cursor: pointer; font: inherit; font-size: 15px; font-weight: 700;
    color: var(--text); background: color-mix(in srgb, var(--accent) 10%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    transition: transform .14s ease, background .14s ease;
  }
  .support:active { transform: scale(.97); background: color-mix(in srgb, var(--accent) 22%, var(--card)); }
  @media (prefers-reduced-motion: reduce) { .tier { animation: none; opacity: 1; } .ripple { display: none; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div id="main">
    <header>
      <button type="button" class="spark" id="spark" aria-label="نجوم">⭐</button>
      <span class="badge" id="badge" hidden></span>
      <h1 id="title">شحن النجوم</h1>
      <p class="sub" id="subtitle"></p>
    </header>

    <div class="info">
      <div class="stat bal"><div class="k">رصيدك الحالي</div><div class="v"><span class="ltr" id="balVal">0.00</span><span class="u">نقطة</span></div></div>
      <div class="stat uid" id="uidBox"><div class="k">الأيدي</div><div class="v" id="uidVal"></div></div>
    </div>

    <div class="section-title">اختر الباقة</div>
    <div class="tiers" id="tiers"></div>

    <button type="button" class="support" id="support">💬 الدعم الفني</button>

    <p class="foot" id="conn"></p>
    <p class="foot" id="foot" hidden></p>
  </div>

  <div class="done" id="done" hidden>
    <div class="ic">✓</div>
    <h2>تم الدفع بنجاح</h2>
    <p>تمت العملية، وستصلك رسالة تأكيد الشحن في البوت.</p>
    <div class="info" id="doneBal" hidden style="margin-bottom:16px">
      <div class="stat bal"><div class="k">رصيدك الحالي</div><div class="v"><span class="ltr" id="doneBalVal">0.00</span><span class="u">نقطة</span></div></div>
    </div>
    <button class="cta" id="again">شحن مرة أخرى</button>
    <button class="cta ghost" id="closeBtn">إغلاق</button>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var Q = new URLSearchParams(location.search);

  // الباقات الثمانية الثابتة
  var AMOUNTS = [10, 15, 25, 50, 70, 100, 150, 200];

  var cfg = {
    rate: parseFloat(Q.get('rate')) || 0.0094,
    balance: Q.get('bal'), uid: Q.get('uid') || '', api: '', live: false,
    ui: { title: 'شحن النجوم', subtitle: 'اختر عدد النجوم لشحن رصيدك مباشرة', badge: '', footer: '' }
  };
  function cleanUrl(u) { return String(u || '').trim().replace(/\/+$/, ''); }
  var apis = (Q.get('api') || '').split(',').map(cleanUrl).filter(function (u) { return /^https:\/\//.test(u); });
  try {
    var c = JSON.parse(Q.get('c') || '{}');
    ['title', 'subtitle', 'badge', 'footer'].forEach(function (k) { if (typeof c[k] === 'string') cfg.ui[k] = c[k]; });
  } catch (e) {}
  var initData = tg && tg.initData ? tg.initData : '';
  try { var tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user; if (!cfg.uid && tu && tu.id) cfg.uid = String(tu.id); } catch (e) {}
  // روابط فواتير جاهزة من البوت: {"50":"$xxxx",...}
  var invMap = {};
  try { invMap = JSON.parse(Q.get('inv') || '{}') || {}; } catch (e) { invMap = {}; }

  var busy = false;

  // ---------- أدوات ----------
  function fmtPts(x) {
    var s = (Math.round(x * 1e4) / 1e4).toFixed(4).replace(/0+$/, '');
    if (/\.$/.test(s)) s += '00'; else if (/\.\d$/.test(s)) s += '0';
    return s;
  }
  function ptsForStars(n) { return Math.round(n * cfg.rate * 1e6) / 1e6; }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }
  function hap(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }

  // ---------- عرض ----------
  function setBalance(b) {
    var txt;
    if (b === null || b === undefined || b === '') txt = '0.00';
    else { var v = parseFloat(b); txt = isNaN(v) ? String(b) : v.toFixed(2); }
    $('balVal').textContent = txt;
    $('balVal').parentNode.classList.toggle('long', txt.length > 11);
  }
  function buildTiers() {
    var box = $('tiers'); box.innerHTML = '';
    AMOUNTS.forEach(function (n) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'tier';
      var a = document.createElement('div'); a.className = 'n'; a.textContent = n + ' ⭐';
      var p = document.createElement('div'); p.className = 'p'; p.textContent = fmtPts(ptsForStars(n)) + ' نقطة';
      b.appendChild(a); b.appendChild(p);
      b.style.animationDelay = (AMOUNTS.indexOf(n) * 45) + 'ms';
      b.addEventListener('click', function (e) {
        ripple(b, e);
        if (busy) return;
        try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {}
        pay(n);
      });
      box.appendChild(b);
    });
  }
  function render() {
    var u = cfg.ui;
    document.title = u.title || 'شحن النجوم';
    $('title').textContent = u.title || 'شحن النجوم';
    $('subtitle').textContent = u.subtitle || ''; $('subtitle').hidden = !u.subtitle;
    $('badge').textContent = u.badge || ''; $('badge').hidden = !u.badge;
    $('uidVal').textContent = cfg.uid || '—';
    $('foot').textContent = u.footer || ''; $('foot').hidden = !u.footer;
    setBalance(cfg.balance);
    buildTiers();
  }

  // ---------- التواصل مع البوت ----------
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function api(path, body, opts) {
    opts = opts || {};
    var tries = opts.tries || 3, timeout = opts.timeout || 12000, attempt = 0;
    var payload = JSON.stringify(Object.assign({ initData: initData }, body || {}));
    function once() {
      attempt++;
      var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, timeout);
      return fetch(cfg.api + path, {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload, signal: ctl.signal
      }).then(function (r) {
        return r.text().then(function (txt) {
          clearTimeout(t);
          try { return JSON.parse(txt); }
          catch (e) { var er = new Error('badjson'); er.kind = 'badjson'; throw er; }
        });
      }).catch(function (e) {
        clearTimeout(t);
        if (!e.kind) e.kind = (e && e.name === 'AbortError') ? 'timeout' : 'network';
        if (attempt < tries) return sleep(600 * attempt).then(once);
        throw e;
      });
    }
    return once();
  }
  function errText(e) {
    var k = e && e.kind;
    return 'السيرفر لا يستجيب (' + (k === 'timeout' ? 'انتهت المهلة' : k === 'badjson' ? 'النفق غير متصل' : 'شبكة/حظر') + ')';
  }
  function setConn(msg) { $('conn').textContent = msg || ''; }
  function probe(u) {
    var ctl = new AbortController(), tm = setTimeout(function () { ctl.abort(); }, 5000);
    return fetch(u + '/health', { cache: 'no-store', signal: ctl.signal })
      .then(function (r) { return r.json(); }).then(function (j) { clearTimeout(tm); return !!(j && j.ok); })
      .catch(function () { clearTimeout(tm); return false; });
  }
  function loadResolver() {
    return fetch('api.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        [].concat(j.api || j.apis || []).map(cleanUrl).forEach(function (u) {
          if (/^https:\/\//.test(u) && apis.indexOf(u) < 0) apis.push(u);
        });
      }).catch(function () {});
  }
  function pickApi() {
    return loadResolver().then(function () {
      var i = 0;
      function next() {
        if (i >= apis.length) return Promise.resolve('');
        var u = apis[i++];
        return probe(u).then(function (ok) { return ok ? u : next(); });
      }
      return next();
    });
  }
  function ensureApi() {
    if (cfg.api && cfg.live) return Promise.resolve(cfg.api);
    return pickApi().then(function (u) { cfg.api = u; return u; });
  }
  function loadMe() {
    if (!initData) return Promise.resolve(false);
    return ensureApi().then(function (u) {
      if (!u) return false;
      return api('/api/stars/me', {}, { tries: 2, timeout: 10000 }).then(function (j) {
        if (!j || !j.ok) return false;
        cfg.balance = j.balance; cfg.uid = String(j.uid || cfg.uid);
        if (j.rate) cfg.rate = +j.rate;
        if (j.ui) ['title', 'subtitle', 'badge', 'footer'].forEach(function (k) { if (typeof j.ui[k] === 'string') cfg.ui[k] = j.ui[k]; });
        cfg.live = true; return true;
      }).catch(function () { cfg.live = false; cfg.api = ''; return false; });
    });
  }

  // ---------- الدفع المباشر ----------
  var tiersBusy = function (on) {
    document.querySelectorAll('.tier').forEach(function (b) { b.disabled = on; });
  };
  function pay(stars) {
    if (busy) return;
    busy = true; tiersBusy(true);
    function resetBtn() { busy = false; tiersBusy(false); }
    function fail(msg) { resetBtn(); setConn(''); toast(msg); hap('error'); }
    if (!tg || !tg.openInvoice) { fail('حدّث تيليجرام لأحدث إصدار لتظهر نافذة الدفع'); return; }
    function openLink(link) {
      try {
        tg.openInvoice(link, function (status) {
          resetBtn();
          if (status === 'paid') { delete invMap[String(stars)]; success(); }
          else if (status === 'failed') { toast('فشلت عملية الدفع، حاول مرة أخرى'); hap('error'); }
        });
      } catch (e) { fail('تعذر فتح نافذة الدفع، حاول مرة أخرى'); }
    }
    // فاتورة جاهزة من الرابط: تظهر فوراً
    var pre = invMap[String(stars)];
    if (pre) { openLink(/^https?:/.test(pre) ? pre : 'https://t.me/' + pre); return; }
    // غير ذلك: نطلب فاتورة من سيرفر البوت
    if (!initData) { fail('افتح الصفحة من زر البوت لتظهر نافذة الدفع'); return; }
    setConn('⏳ جاري تجهيز الفاتورة...');
    ensureApi().then(function (u) {
      if (!u) { fail('السيرفر غير متاح حالياً، حاول بعد لحظات'); return; }
      return api('/api/stars/invoice', { stars: stars }, { tries: 2, timeout: 10000 }).then(function (j) {
        setConn('');
        if (j && j.ok && j.link) { cfg.live = true; invMap[String(stars)] = j.link; openLink(j.link); return; }
        fail((j && j.error) || 'تعذر تجهيز الفاتورة، حاول مرة أخرى');
      }, function (e) {
        cfg.live = false; cfg.api = ''; fail(errText(e) + ' — حاول مرة أخرى');
      });
    });
  }
  function success() {
    hap('success');
    $('main').hidden = true; $('done').hidden = false;
    var before = parseFloat(cfg.balance) || 0, tries = 0;
    $('doneBal').hidden = !cfg.live;
    $('doneBalVal').textContent = before.toFixed(2);
    if (!cfg.live) return;
    (function poll() {
      loadMe().then(function () {
        var now = parseFloat(cfg.balance) || 0;
        $('doneBalVal').textContent = now.toFixed(2); setBalance(cfg.balance);
        if (now > before + 1e-9 || ++tries >= 10) return;
        setTimeout(poll, 1500);
      });
    })();
  }

  // ---------- أحداث ----------
  $('again').addEventListener('click', function () { $('done').hidden = true; $('main').hidden = false; });
  $('closeBtn').addEventListener('click', function () { if (tg && tg.close) tg.close(); });

  // ---------- تأثيرات وأزرار إضافية ----------
  function ripple(el, e) {
    try {
      var r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
      var x = (e && e.clientX ? e.clientX : r.left + r.width / 2) - r.left - d / 2;
      var y = (e && e.clientY ? e.clientY : r.top + r.height / 2) - r.top - d / 2;
      var s = document.createElement('span'); s.className = 'ripple';
      s.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + x + 'px;top:' + y + 'px';
      el.appendChild(s); setTimeout(function () { s.remove(); }, 650);
    } catch (x) {}
  }
  function burst(fromEl) {
    var r = fromEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var icons = ['⭐', '🌟', '✨', '⭐', '💫'];
    for (var i = 0; i < 16; i++) {
      var el = document.createElement('div'); el.className = 'fly';
      el.textContent = icons[i % icons.length];
      el.style.left = (cx - 10) + 'px'; el.style.top = (cy - 10) + 'px';
      document.body.appendChild(el);
      var ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 130;
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 40, rot = (Math.random() - .5) * 540;
      var sc = .7 + Math.random() * .9;
      var an = el.animate([
        { transform: 'translate(0,0) scale(.3) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + dx * .7 + 'px,' + dy * .7 + 'px) scale(' + sc + ') rotate(' + rot * .6 + 'deg)', opacity: 1, offset: .55 },
        { transform: 'translate(' + dx + 'px,' + (dy + 70) + 'px) scale(' + sc * .6 + ') rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
      an.onfinish = (function (n) { return function () { n.remove(); }; })(el);
    }
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (x) {}
  }
  $('spark').addEventListener('click', function () { burst($('spark')); });
  $('support').addEventListener('click', function () {
    var url = 'https://t.me/V_xde';
    try { if (tg && tg.openTelegramLink) { tg.openTelegramLink(url); return; } } catch (e) {}
    window.open(url, '_blank');
  });

  render();
  if (!initData) setConn('افتح هذه الصفحة من زر «فتح صفحة الشحن» داخل البوت.');
  else (function boot(n) {
    setConn('⏳ جاري الاتصال بسيرفر الدفع...');
    loadMe().then(function (ok) {
      if (ok) { setConn(''); render(); return; }
      if (n < 15) setTimeout(function () { boot(n + 1); }, Math.min(2000 + n * 1000, 6000));
      else setConn('⚠️ تعذر الاتصال بالسيرفر. أغلق الصفحة وافتحها من البوت.');
    });
  })(0);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || busy || cfg.live || !initData) return;
    loadMe().then(function (ok) { if (ok) render(); });
  });
})();
</script>
